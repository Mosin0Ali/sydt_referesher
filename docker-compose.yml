services:
  db:
    image: postgres:16            # pinned major version, same as Cloud SQL later
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app      # fine locally; never in real environments
      POSTGRES_DB: tradetools
    ports:
      - "5432:5432"               # host port : container port
    volumes:
      - pgdata:/var/lib/postgresql/data   # data survives container restarts
    command: ["postgres", "-c", "shared_preload_libraries=pg_stat_statements"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d tradetools"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata: